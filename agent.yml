name: Pro PC Builder
model: gpt-5.2
welcome_text: "Tell me your budget, country, and main use — I’ll spec two compatible PC builds."
instructions_file: instructions.md
tools:
  - web_search
  - suggest_retailers
  - estimate_psu
  - validate_compatibility
model_settings:
  temperature: 0.7
  max_tokens: 4096

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names:
    - web_search
    - suggest_retailers
    - estimate_psu
    - validate_compatibility
