name: Accessibility Audit Agent
model: gpt-5.2
welcome_text: "Give me a URL or a local folder and I’ll audit accessibility (WCAG 2.1 AA baseline)."
instructions_file: instructions.md
tools:
  - run_accessibility_audit
  - run_multisite_accessibility_audit
  - list_documents_for_a11y_scan
  - scan_documents_accessibility
  - propose_document_fixes
  - apply_document_fixes
  - convert_ppt_to_pptx
  - read_image
  - extract_document_images
  - apply_document_alt_text
  - cleanup_temp_artifacts
model_settings:
  temperature: 0.3
  max_tokens: 4096

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names:
    - run_accessibility_audit
    - list_documents_for_a11y_scan
    - scan_documents_accessibility
    - propose_document_fixes
    - read_image
    - extract_document_images
    - cleanup_temp_artifacts
